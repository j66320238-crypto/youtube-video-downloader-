<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yak</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5.2 4.6c.7-.5 1.7-.4 2.4.2l1.9 1.6c.8.7 1 1.8.5 2.7l-.8 1.4c.8 1.7 2.1 3 3.8 3.8l1.4-.8c.9-.5 2-.3 2.7.5l1.6 1.9c.6.7.7 1.7.2 2.4l-1.1 1.6c-.6.9-1.7 1.3-2.7 1-5.5-1.6-9.6-5.7-11.2-11.2-.3-1 .1-2.1 1-2.7l1.6-1.1Z" fill="currentColor"/>
            <path d="M14.6 3.4h6v6M20.2 3.8l-5.4 5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <div class="brand-name">Yak</div>
          <div class="brand-sub">Video grabber</div>
        </span>
      </div>
      <div class="top-actions">
        <span id="engine" class="engine-pill">Checking</span>
        <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="3.1"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.99 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.99a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.99 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6c.6.25 1.32.12 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.99v.02c.25.6 1 .98 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.98Z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="body">
      <section id="currentCard" class="current card" aria-live="polite">
        <div class="skeleton-row">
          <div class="sk sk-thumb"></div>
          <div class="sk-lines">
            <div class="sk sk-line"></div>
            <div class="sk sk-line short"></div>
          </div>
        </div>
      </section>

      <section class="recent" aria-labelledby="recentTitle">
        <div class="section-head">
          <h2 id="recentTitle">Downloads</h2>
          <button id="clearHistory" class="link-btn hidden">Clear history</button>
        </div>
        <div id="jobList" class="job-list">
          <div class="empty">
            <div class="empty-ring" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.5 16.5v1.8A2.7 2.7 0 0 0 7.2 21h9.6a2.7 2.7 0 0 0 2.7-2.7v-1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <p>No downloads yet.</p>
            <span>Hover any YouTube thumbnail and hit the arrow.</span>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer" class="footer">
      <div class="foot-note">
        <span id="footDot" class="dot"></span>
        <span id="footText">Checking helper…</span>
      </div>
      <button id="startHelper" class="btn hidden">How to start</button>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="dot"></span><span id="toastText"></span>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
